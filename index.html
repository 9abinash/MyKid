<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ffffff" />
  <title>YouTube</title>
  <link rel="manifest" href="manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; user-select: none; }
    .aspect-short { aspect-ratio: 9 / 16; }
  </style>
</head>
<body class="bg-white text-gray-900 flex flex-col h-screen overflow-hidden font-sans">

  <!-- Top App Bar (YouTube Branding) -->
  <header class="flex items-center justify-between px-4 py-3 border-b border-gray-200 bg-white z-10">
    <div class="flex items-center space-x-1">
      <svg class="w-8 h-8 text-red-600 fill-current" viewBox="0 0 24 24">
        <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
      </svg>
      <span class="text-xl font-bold tracking-tighter">YouTube</span>
    </div>
  </header>

  <!-- Only 2 Options at Top: Videos & Shorts -->
  <div id="topToggle" class="flex justify-center space-x-4 py-2.5 bg-white border-b border-gray-100 z-10">
    <button id="btnVideos" onclick="switchFeed('videos')" class="px-6 py-1.5 rounded-full text-sm font-semibold bg-gray-900 text-white">
      Videos
    </button>
    <button id="btnShorts" onclick="switchFeed('shorts')" class="px-6 py-1.5 rounded-full text-sm font-semibold bg-gray-100 text-gray-800">
      Shorts
    </button>
  </div>

  <!-- Main Content Area -->
  <main class="flex-1 overflow-y-auto pb-16" id="mainContainer">
    <!-- Videos Feed -->
    <div id="videosFeed" class="space-y-4 pb-6"></div>

    <!-- Shorts Feed (2-Column Vertical Grid) -->
    <div id="shortsFeed" class="hidden grid grid-cols-2 gap-2 p-2"></div>

    <!-- Parental Control Dashboard (Hidden until PIN verified) -->
    <div id="parentDashboard" class="hidden p-4 space-y-6">
      <div class="flex items-center justify-between border-b pb-3">
        <h2 class="text-lg font-bold">Parental Control</h2>
        <span class="text-xs bg-green-100 text-green-800 px-2.5 py-1 rounded-full font-medium">Unlocked</span>
      </div>

      <!-- Google Sign-In Section -->
      <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 space-y-2">
        <p class="text-sm font-semibold text-gray-700">Parent Account Login</p>
        <div id="g_id_onload"
             data-client_id="YOUR_GOOGLE_OAUTH_CLIENT_ID.apps.googleusercontent.com"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>
        <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline" data-text="sign_in_with" data-shape="rectangular"></div>
        <p id="parentEmail" class="text-xs text-gray-500 pt-1">Not signed in</p>
      </div>

      <!-- Whitelisted Channels Management -->
      <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 space-y-3">
        <p class="text-sm font-semibold text-gray-700">Approved Channels</p>
        <div class="flex space-x-2">
          <input id="channelInput" type="text" placeholder="Add @Handle or Channel Name" class="flex-1 px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-red-500" />
          <button onclick="addChannel()" class="bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-semibold">Add</button>
        </div>
        <ul id="channelList" class="divide-y divide-gray-200 text-sm"></ul>
      </div>

      <!-- Change PIN -->
      <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 space-y-2">
        <p class="text-sm font-semibold text-gray-700">Parent 4-Digit PIN</p>
        <div class="flex space-x-2">
          <input id="newPinInput" type="password" maxlength="4" placeholder="New 4-digit PIN" class="flex-1 px-3 py-2 border rounded-lg text-sm" />
          <button onclick="updatePin()" class="bg-gray-900 text-white px-4 py-2 rounded-lg text-sm font-semibold">Save PIN</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Video Player Modal -->
  <div id="playerModal" class="hidden fixed inset-0 bg-black z-50 flex flex-col">
    <div class="flex justify-between items-center p-4 bg-black text-white">
      <span id="playerTitle" class="text-sm font-medium truncate pr-4">Playing</span>
      <button onclick="closePlayer()" class="bg-gray-800 px-3 py-1 rounded-full text-xs font-bold">✕ Close</button>
    </div>
    <div class="flex-1 flex items-center justify-center">
      <iframe id="ytIframe" class="w-full h-full" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
  </div>

  <!-- PIN Gate Modal -->
  <div id="pinModal" class="hidden fixed inset-0 bg-black/60 z-40 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-xs text-center space-y-4">
      <h3 class="text-lg font-bold">Parental Gate</h3>
      <p class="text-xs text-gray-500">Enter 4-digit PIN (Default: 1234)</p>
      <input id="pinAttempt" type="password" maxlength="4" class="w-full text-center text-2xl tracking-widest border-b-2 border-gray-300 focus:border-red-600 focus:outline-none py-2" />
      <div class="flex space-x-2 pt-2">
        <button onclick="closePinModal()" class="flex-1 py-2 rounded-lg bg-gray-100 text-sm font-semibold">Cancel</button>
        <button onclick="verifyPin()" class="flex-1 py-2 rounded-lg bg-red-600 text-white text-sm font-semibold">Unlock</button>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation Bar (Home & Parental Control) -->
  <nav class="fixed bottom-0 inset-x-0 bg-white border-t border-gray-200 flex justify-around py-2 z-20">
    <button onclick="openHome()" id="navHome" class="flex flex-col items-center text-red-600">
      <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span class="text-xs font-medium mt-0.5">Home</span>
    </button>
    <button onclick="openPinModal()" id="navParent" class="flex flex-col items-center text-gray-500">
      <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
      <span class="text-xs font-medium mt-0.5">Parental Control</span>
    </button>
  </nav>

  <script>
    // State Management
    let parentPin = localStorage.getItem('yt_pin') || '1234';
    let channels = JSON.parse(localStorage.getItem('yt_channels')) || ['@SciShowKids', '@NatGeoKids', '@ArtForKidsHub'];

    const sampleVideos = [
      { id: 'yCjJyiqpAuU', title: 'Twinkle Twinkle Little Star', channel: '@SuperSimpleSongs', duration: '2:34' },
      { id: 'R93ce4FZGbc', title: 'How To Draw A Cute Ice Cream Cone', channel: '@ArtForKidsHub', duration: '5:22' },
      { id: 'wL2N6yN1E2s', title: 'Why Do Lions Have Manes?', channel: '@SciShowKids', duration: '4:15' }
    ];

    const sampleShorts = [
      { id: '5qap5aO4i9A', title: 'Amazing Baby Animals!', channel: '@NatGeoKids' },
      { id: 'jfKfPfyJRdk', title: 'Quick Science Trick', channel: '@SciShowKids' },
      { id: 'DWcJFNfaw9c', title: '30-Second Folding Craft', channel: '@ArtForKidsHub' },
      { id: 'n61ULEU7CO0', title: 'Fun Dino Facts', channel: '@NatGeoKids' }
    ];

    function renderFeeds() {
      const vContainer = document.getElementById('videosFeed');
      vContainer.innerHTML = sampleVideos
        .filter(v => channels.includes(v.channel))
        .map(v => `
          <div onclick="playVideo('${v.id}', '${v.title}')" class="cursor-pointer">
            <div class="relative w-full aspect-video bg-gray-200">
              <img src="https://i.ytimg.com/vi/${v.id}/hqdefault.jpg" class="w-full h-full object-cover" />
              <span class="absolute bottom-2 right-2 bg-black/80 text-white text-xs px-1.5 py-0.5 rounded">${v.duration}</span>
            </div>
            <div class="p-3 flex space-x-3">
              <div class="w-9 h-9 rounded-full bg-red-600 text-white flex items-center justify-center font-bold text-sm">▶</div>
              <div>
                <h3 class="text-sm font-semibold leading-snug">${v.title}</h3>
                <p class="text-xs text-gray-500 mt-0.5">${v.channel}</p>
              </div>
            </div>
          </div>
        `).join('') || '<p class="text-center text-gray-400 text-sm py-12">No approved videos available.</p>';

      const sContainer = document.getElementById('shortsFeed');
      sContainer.innerHTML = sampleShorts
        .filter(s => channels.includes(s.channel))
        .map(s => `
          <div onclick="playVideo('${s.id}', '${s.title}')" class="relative rounded-xl overflow-hidden bg-gray-900 aspect-short cursor-pointer">
            <img src="https://i.ytimg.com/vi/${s.id}/hqdefault.jpg" class="w-full h-full object-cover opacity-90" />
            <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/80 to-transparent p-3 text-white">
              <p class="text-xs font-bold leading-tight">${s.title}</p>
              <p class="text-[10px] text-gray-300 mt-1">${s.channel}</p>
            </div>
          </div>
        `).join('') || '<p class="col-span-2 text-center text-gray-400 text-sm py-12">No approved Shorts available.</p>';
    }

    function switchFeed(type) {
      const isVideos = type === 'videos';
      document.getElementById('videosFeed').classList.toggle('hidden', !isVideos);
      document.getElementById('shortsFeed').classList.toggle('hidden', isVideos);
      document.getElementById('btnVideos').className = isVideos
        ? 'px-6 py-1.5 rounded-full text-sm font-semibold bg-gray-900 text-white'
        : 'px-6 py-1.5 rounded-full text-sm font-semibold bg-gray-100 text-gray-800';
      document.getElementById('btnShorts').className = !isVideos
        ? 'px-6 py-1.5 rounded-full text-sm font-semibold bg-gray-900 text-white'
        : 'px-6 py-1.5 rounded-full text-sm font-semibold bg-gray-100 text-gray-800';
    }

    function playVideo(id, title) {
      document.getElementById('playerTitle').textContent = title;
      document.getElementById('ytIframe').src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0&modestbranding=1`;
      document.getElementById('playerModal').classList.remove('hidden');
    }

    function closePlayer() {
      document.getElementById('ytIframe').src = '';
      document.getElementById('playerModal').classList.add('hidden');
    }

    function openHome() {
      document.getElementById('parentDashboard').classList.add('hidden');
      document.getElementById('topToggle').classList.remove('hidden');
      switchFeed('videos');
      document.getElementById('navHome').classList.replace('text-gray-500', 'text-red-600');
      document.getElementById('navParent').classList.replace('text-red-600', 'text-gray-500');
    }

    function openPinModal() {
      document.getElementById('pinAttempt').value = '';
      document.getElementById('pinModal').classList.remove('hidden');
    }

    function closePinModal() {
      document.getElementById('pinModal').classList.add('hidden');
    }

    function verifyPin() {
      if (document.getElementById('pinAttempt').value === parentPin) {
        closePinModal();
        document.getElementById('topToggle').classList.add('hidden');
        document.getElementById('videosFeed').classList.add('hidden');
        document.getElementById('shortsFeed').classList.add('hidden');
        document.getElementById('parentDashboard').classList.remove('hidden');
        document.getElementById('navParent').classList.replace('text-gray-500', 'text-red-600');
        document.getElementById('navHome').classList.replace('text-red-600', 'text-gray-500');
        renderChannels();
      } else {
        alert('Incorrect PIN');
      }
    }

    function renderChannels() {
      document.getElementById('channelList').innerHTML = channels.map((ch, idx) => `
        <li class="py-2.5 flex justify-between items-center">
          <span class="font-medium">${ch}</span>
          <button onclick="removeChannel(${idx})" class="text-red-600 text-xs font-semibold">Remove</button>
        </li>
      `).join('');
    }

    function addChannel() {
      const val = document.getElementById('channelInput').value.trim();
      if (val && !channels.includes(val)) {
        channels.push(val.startsWith('@') ? val : '@' + val);
        localStorage.setItem('yt_channels', JSON.stringify(channels));
        document.getElementById('channelInput').value = '';
        renderChannels();
        renderFeeds();
      }
    }

    function removeChannel(idx) {
      channels.splice(idx, 1);
      localStorage.setItem('yt_channels', JSON.stringify(channels));
      renderChannels();
      renderFeeds();
    }

    function updatePin() {
      const val = document.getElementById('newPinInput').value.trim();
      if (/^\d{4}$/.test(val)) {
        parentPin = val;
        localStorage.setItem('yt_pin', parentPin);
        document.getElementById('newPinInput').value = '';
        alert('PIN updated!');
      } else {
        alert('Enter a valid 4-digit PIN');
      }
    }

    function handleCredentialResponse(response) {
      const payload = JSON.parse(atob(response.credential.split('.')[1]));
      document.getElementById('parentEmail').textContent = 'Signed in as: ' + payload.email;
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    renderFeeds();
  </script>
</body>
</html>
